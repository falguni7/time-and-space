[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "presslens"
version = "0.1.0"
description = "Explainable, personalised match intelligence from synthetic football data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Pinned to what the PressLens container provides (NumPy 1.x stack).
dependencies = [
    "numpy>=1.23,<2",
    "pandas>=1.5,<2",
    "scipy>=1.12",
    "scikit-learn>=1.2",
    "duckdb>=2.0",
    "pyarrow>=14,<20",
    "pydantic>=2.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["presslens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
