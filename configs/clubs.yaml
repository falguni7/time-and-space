# The 8 fictional clubs of the PressLens league.
#
# `tactics` is the hidden ground truth the engine's metrics are validated against:
#   press_intensity   0-1  how close defenders get to the carrier and to passing options
#   press_height      high | mid | low   where the team starts pressing
#   compactness       0-1  how narrow and short the shape is without the ball
#   decision_quality  0-1  how often the carrier picks the best option
#   tempo             0-1  how quickly players release the ball
#
# `tier` sets squad strength when players are generated: strong ~80, mid ~76, weak ~73 average OVR.

clubs:
  - id: RIV
    name: Riverside Reds
    tier: strong
    colors: {primary: "#d62828", secondary: "#ffffff"}
    tactics: {formation: "4-3-3", press_intensity: 0.85, press_height: high, compactness: 0.70, decision_quality: 0.80, tempo: 0.75}

  - id: NOR
    name: Northgate Blues
    tier: strong
    colors: {primary: "#1d4ed8", secondary: "#f8fafc"}
    tactics: {formation: "4-2-3-1", press_intensity: 0.60, press_height: mid, compactness: 0.75, decision_quality: 0.90, tempo: 0.45}

